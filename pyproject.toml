[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-chunking"
version = "0.4.0"
description = "A lightweight document layout detection library using ONNX models and PyMuPDF"
authors = [
    {name = "Tatoao Liang", email = "tatoao@126.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
keywords = ["document", "pdf", "layout-detection", "onnx", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyMuPDF==1.25.1",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "numpy<=1.26.4",
    "opencv-python>=4.5.0",
    "onnxruntime>=1.15.0",
    "modelscope",
    "paddleocr",
    "pdfplumber",
    "processor-pipeline@git+https://${GITHUB_TOKEN}@github.com/TATOAO/processor_architecture.git@prd",
    "python-dotenv",
    "rapidfuzz",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.15.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
    "mypy",
]
all = [
    "onnxruntime-gpu>=1.15.0",
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/TATOAO/doc_visual_parsor"
Documentation = "https://github.com/TATOAO/doc_visual_parsor#readme"
Repository = "https://github.com/TATOAO/doc_visual_parsor"
"Bug Tracker" = "https://github.com/TATOAO/doc_visual_parsor/issues"

[project.scripts]
doc-chunking-detect = "doc_chunking.src.example:main"

[tool.setuptools.packages.find]
include = ["doc_chunking*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
"doc_chunking" = ["*.json", "*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
