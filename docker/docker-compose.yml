# Docker Compose configuration for PDF Layout Extraction API
# Optimized for GPU deployment

version: '3.8'

services:
  pdf-layout-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pdf-layout-extraction:latest
    container_name: pdf-layout-api
    ports:
      - "8887:8887"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount model parameters for easier updates
      - ../model_parameters:/app/model_parameters:ro
      # Optional: Mount logs directory
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8887/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pdf-api-network

networks:
  pdf-api-network:
    driver: bridge

